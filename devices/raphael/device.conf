# devices/raphael/device.conf: what this device repository is (docs/porting/repositories.md has every word).

device raphael
	title       Redmi K20 Pro / Mi 9T Pro
	vendor      Xiaomi
	soc         sm8150
	defconfig   raphael_defconfig
	firmware    kit/pull-firmware.sh
	maintainer  adelholzener69
	status      display     works     UEFI's framebuffer through the loader, panel brightness over DCS (brightness=1 brightness_dcs=1)
	status      touch       works     touchscreen=1
	status      buttons     works     buttons=1
	status      cpu         works     7 of 8 cores, cpufreq=1
	status      gpu         works     Adreno 640 through GLES (gpu=1); needs fw-gpu/
	status      audio       works     loudspeaker only, TFA9874 amplifier (adsp_step=12 tfa=1 tfa_tx=1 ios_audio=1); needs fw-audio/ with mono.cnt
	status      battery     works     level through the loader (battery=1)
	status      wifi        partial   WCN3990 / ath10k SNOC: WPA2 and WPA3 join and load pages; slow to join, off/on can leave the scan empty (wifi_step=15 ...)
	status      storage     missing   the RAM image only; nothing is saved
	status      cellular    missing
	status      bluetooth   missing
	status      haptic      missing
	status      torch       missing
	status      camera      missing
